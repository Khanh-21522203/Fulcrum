services:

  broker:
    build:
      context: .
      dockerfile: broker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      PYTHONUNBUFFERED: "1"
      FULCRUM_DATABASE_URL: postgresql://fulcrum:fulcrum@postgres:5432/fulcrum
      FULCRUM_OBJECT_STORE_PROVIDER: minio
      FULCRUM_MINIO_ENDPOINT: minio:9000
      FULCRUM_MINIO_ACCESS_KEY: fulcrum
      FULCRUM_MINIO_SECRET_KEY: fulcrum-secret
      FULCRUM_OBJECT_STORE_BUCKET: fulcrum-artifacts
      FULCRUM_DNS_PROVIDER: local-file
      FULCRUM_CERTIFICATE_PROVIDER: local-file
      FULCRUM_SECRET_STORE_PROVIDER: local-file
      FULCRUM_LOCAL_STATE_DIR: /var/lib/fulcrum/local
    volumes:
      - local-provider-data:/var/lib/fulcrum/local
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  control-plane:
    build:
      context: .
      dockerfile: control-plane/Dockerfile
    ports:
      - "8081:8080"   # HTTP ops API (healthz, snapshots, etc.)
      - "18000:18000" # gRPC ADS stream (Envoy connects here)
    environment:
      PYTHONUNBUFFERED: "1"
      FULCRUM_DEV_SEED_INSTANCE: "1"
      FULCRUM_DEV_NODE_GROUP: "local"
      FULCRUM_DEV_UPSTREAM_HOST: "control-plane"
      FULCRUM_DEV_UPSTREAM_PORT: "8080"
      FULCRUM_CP_INSTANCE_SOURCE: memory
      FULCRUM_DATABASE_URL: postgresql://fulcrum:fulcrum@postgres:5432/fulcrum
      FULCRUM_OBJECT_STORE_PROVIDER: minio
      FULCRUM_MINIO_ENDPOINT: minio:9000
      FULCRUM_MINIO_ACCESS_KEY: fulcrum
      FULCRUM_MINIO_SECRET_KEY: fulcrum-secret
      FULCRUM_OBJECT_STORE_BUCKET: fulcrum-artifacts
      FULCRUM_DNS_PROVIDER: local-file
      FULCRUM_CERTIFICATE_PROVIDER: local-file
      FULCRUM_SECRET_STORE_PROVIDER: local-file
      FULCRUM_LOCAL_STATE_DIR: /var/lib/fulcrum/local
    volumes:
      - local-provider-data:/var/lib/fulcrum/local
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      FULCRUM_DATABASE_URL: postgresql://fulcrum:fulcrum@postgres:5432/fulcrum
      FULCRUM_OBJECT_STORE_PROVIDER: minio
      FULCRUM_MINIO_ENDPOINT: minio:9000
      FULCRUM_MINIO_ACCESS_KEY: fulcrum
      FULCRUM_MINIO_SECRET_KEY: fulcrum-secret
      FULCRUM_OBJECT_STORE_BUCKET: fulcrum-artifacts
      FULCRUM_DNS_PROVIDER: local-file
      FULCRUM_CERTIFICATE_PROVIDER: local-file
      FULCRUM_SECRET_STORE_PROVIDER: local-file
      FULCRUM_LOCAL_STATE_DIR: /var/lib/fulcrum/local
    volumes:
      - local-provider-data:/var/lib/fulcrum/local
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  auth-sidecar:
    build:
      context: .
      dockerfile: auth-sidecar/Dockerfile
    ports:
      - "9191:9191"
    environment:
      PYTHONUNBUFFERED: "1"

  rate-limit-sidecar:
    build:
      context: .
      dockerfile: rate-limit-sidecar/Dockerfile
    ports:
      - "8082:8081"
    environment:
      PYTHONUNBUFFERED: "1"

  envoy:
    image: envoyproxy/envoy:v1.32-latest
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "10080:8080" # inbound HTTP for local development
      - "9901:9901"  # Envoy admin interface (localhost only in prod)
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml"]
    environment:
      NODE_GROUP: local
      HOSTNAME: envoy-local-1
      CONTROL_PLANE_HOST: control-plane
    depends_on:
      - control-plane
      - auth-sidecar
      - rate-limit-sidecar

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: fulcrum
      MINIO_ROOT_PASSWORD: fulcrum-secret
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mc alias set local http://minio:9000 fulcrum fulcrum-secret; do sleep 1; done &&
        mc mb --ignore-existing local/fulcrum-artifacts

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fulcrum
      POSTGRES_USER: fulcrum
      POSTGRES_PASSWORD: fulcrum
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fulcrum -d fulcrum"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Azure Cosmos DB emulator (commented out — image is ~4 GB).
  # Uncomment to run a local Cosmos DB instance for broker / worker / control-plane dev.
  # cosmosdb:
  #   image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator
  #   ports:
  #     - "8084:8081"
  #   environment:
  #     AZURE_COSMOS_EMULATOR_PARTITION_COUNT: "3"
  #     AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE: "false"

volumes:
  postgres-data:
  minio-data:
  local-provider-data:
