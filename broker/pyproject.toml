[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "broker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "fulcrum-shared",
]

[tool.hatch.build.targets.wheel]
packages = ["broker"]
