[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "control-plane"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
    "fulcrum-grpc-api",
    "fulcrum-shared",
]

[tool.hatch.build.targets.wheel]
packages = ["control_plane"]
