syntax = "proto3";

package envoy.service.auth.v3;

// Minimal AttributeContext surface needed by HTTP ext_authz checks.
message AttributeContext {
  message Peer {
    string principal = 1;
  }

  message Request {
    message HttpRequest {
      string id = 1;
      string method = 2;
      map<string, string> headers = 3;
      string path = 4;
      string host = 5;
      string scheme = 6;
      string query = 7;
      string fragment = 8;
      int64 size = 9;
      string protocol = 10;
      string body = 11;
      bytes raw_body = 12;
    }

    HttpRequest http = 2;
  }

  Peer source = 1;
  Peer destination = 2;
  Request request = 4;
}
